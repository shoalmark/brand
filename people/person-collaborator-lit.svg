<svg xmlns="http://www.w3.org/2000/svg" class="pp pp-collaborator lit" data-role="collaborator" width="64" height="64" viewBox="-1.8 -1.8 35.6 35.6" aria-hidden="true"><style>.pp{--pp-d:#f1e1b0;--pp-i:#10202e;--pp-k:#f1e1b0;display:block;overflow:visible}@media(prefers-color-scheme:light){.pp{--pp-k:#10202e}}:root[data-theme=light] .pp{--pp-k:#10202e}:root[data-theme=dark] .pp{--pp-k:#f1e1b0}.pp .d{fill:var(--pp-d)}.pp .i{fill:var(--pp-i)}.pp .ds{fill:none;stroke:var(--pp-d);stroke-linecap:round;stroke-linejoin:round}.pp .is{fill:none;stroke:var(--pp-i);stroke-linecap:round;stroke-linejoin:round}.pp .rim{fill:none;stroke:var(--pp-k);stroke-width:1px;vector-effect:non-scaling-stroke}.pp .ring{fill:none;stroke:var(--pp-k);stroke-width:1.25px;vector-effect:non-scaling-stroke;opacity:0}.pp.lit .ring{opacity:1}.pp .hd{transform-box:fill-box;transform-origin:50% 100%}.pp .sl{transform-box:fill-box;transform-origin:50% 50%}@media(prefers-reduced-motion:no-preference){.pp.lit .ring{animation:ppg 1.6s ease-in-out infinite}.pp.lit .hd{animation:pph 1.1s ease-in-out 3}.pp.lit .sl{animation:pps 1.1s ease-in-out 3}}html.rm .pp *,.pp.still *{animation:none!important}@keyframes ppg{0%,100%{opacity:.45}50%{opacity:1}}@keyframes pph{0%,100%{transform:translateY(0)}35%{transform:translateY(-1.2px)}}@keyframes pps{0%,100%{transform:scale(1)}40%{transform:scale(.85)}}</style><circle class="ring" cx="16" cy="16" r="16.6"/><circle class="d" cx="16" cy="16" r="14"/><path class="i" d="M4.5 23.98C4.5 18.6 10 16.8 16 16.8C22 16.8 27.5 18.6 27.5 23.98A14 14 0 0 1 4.5 23.98Z"/><path class="ds" style="stroke-width:2.7" d="M11.2 17L13.8 19.8M20.8 17L18.2 19.8"/><rect class="d" x="9.9" y="19.6" width="12.2" height="9" rx="1.2"/><path class="i" d="M13.4 21.5H18.6V22.8H13.4Z"/><g class="hd"><circle class="i" cx="16" cy="10.2" r="4.6"/></g><circle class="rim" cx="16" cy="16" r="14"/></svg>
